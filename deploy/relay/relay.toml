# OpenResty owns public TLS and proxies this loopback-published HTTP listener.

http_bind_addr = "0.0.0.0:38451"
enable_quic_addr_discovery = false
enable_metrics = false
access = "everyone"

# Per-client receive allowance for sustained and burst traffic.
[limits.client.rx]
bytes_per_second = 8388608
max_burst_bytes = 16777216
