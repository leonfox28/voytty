name: voytty-relay

services:
  relay:
    container_name: voytty-relay
    build: .
    image: voytty/iroh-relay:1.3.0
    pull_policy: never
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    volumes:
      - ./relay.toml:/etc/iroh-relay/relay.toml:ro
    ports:
      - "127.0.0.1:38451:38451"
    restart: unless-stopped
    logging:
      driver: local
