[package]
name = "voytty-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "voytty"
path = "src/main.rs"

[dependencies]
voytty-diagnostics.workspace = true
arboard.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
qrcode.workspace = true
png.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
unicode-width.workspace = true
zeroize.workspace = true
voytty-core.workspace = true
voytty-client.workspace = true
voytty-daemon.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term"] }
rustix.workspace = true

[dev-dependencies]
voytty-platform.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "term"] }

[lints]
workspace = true

[[test]]
name = "daemon_autospawn"
path = "tests/daemon_autospawn.rs"
harness = false

[target.'cfg(windows)'.dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows", "bracketed-paste"] }
winsafe = { version = "=0.0.29", features = ["kernel"] }
