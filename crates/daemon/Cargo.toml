[package]
name = "voytty-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
voytty-diagnostics.workspace = true
flate2.workspace = true
futures-util.workspace = true
iroh = { workspace = true, features = ["portmapper"] }
prost.workspace = true
ring.workspace = true
reqwest.workspace = true
rustls.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tar.workspace = true
tempfile.workspace = true
zeroize.workspace = true
voytty-core.workspace = true
voytty-client.workspace = true
voytty-platform.workspace = true
voytty-proto.workspace = true
voytty-terminal.workspace = true

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils", "unstable-custom-transports"] }
anyhow.workspace = true
futures-util.workspace = true
iroh-relay.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "term"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
iroh = { workspace = true, features = ["unstable-net-report"] }
patchbay.workspace = true

[[test]]
name = "terminal_drain"
path = "tests/terminal_drain.rs"
harness = false

[[test]]
name = "attachment_resync"
path = "tests/attachment_resync.rs"
harness = false

[[test]]
name = "terminal_blackbox"
path = "tests/terminal_blackbox.rs"
harness = false

[[test]]
name = "single_instance"
path = "tests/single_instance.rs"
harness = false

[[test]]
name = "detached_lifecycle"
path = "tests/detached_lifecycle.rs"
harness = false

[[test]]
name = "cross_uid"
path = "tests/cross_uid.rs"
harness = false

[lints]
workspace = true

[[test]]
name = "windows_lifecycle"
path = "tests/windows_lifecycle.rs"
harness = false
