[package]
name = "voytty-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
voytty-diagnostics.workspace = true
portable-pty.workspace = true
voytty-core.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
filedescriptor.workspace = true
mio.workspace = true

[[test]]
name = "pty_lifecycle"
path = "tests/pty_lifecycle.rs"
harness = false

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
interprocess = { version = "=2.4.7", features = ["tokio"] }
widestring = "=1.2.1"
win-custody = "=0.1.1"
winsafe = { version = "=0.0.29", features = ["advapi"] }
dirs = "=6.0.0"
ring.workspace = true
