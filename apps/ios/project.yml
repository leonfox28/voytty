name: Voytty
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
configFiles:
  Debug: Generated/Version.xcconfig
  Release: Generated/Version.xcconfig
targets:
  Voytty:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Generated/VoyttyNative.swift
      - path: ../android/app/src/main/res/font
        type: folder
        buildPhase: resources
      - path: ../android/app/src/main/assets/licenses
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        UIAppFonts:
          - font/terminal_mono.ttf
          - font/terminal_mono_bold.ttf
          - font/terminal_mono_italic.ttf
          - font/terminal_mono_bold_italic.ttf
        # One AppModel owns the connection, viewport and input; a second iPad
        # window would share and resize the same terminal. The generated
        # manifest always enables multiple scenes, so declare it explicitly.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.voytty
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: voytty
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your paired computer and its terminal sessions.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a pairing QR code to connect to your computer.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Platform/Bridge.h
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/VoyttyNativeFFI.modulemap
        LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS: $(inherited) -lvoytty_android -lresolv -framework Security -framework SystemConfiguration
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.voytty.dev
          INFOPLIST_KEY_CFBundleDisplayName: voytty Dev
    preBuildScripts:
      - name: Build Rust for selected SDK
        script: |
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          python3 "$SRCROOT/../../tools/ios/build.py" native
        basedOnDependencyAnalysis: false
  VoyttyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Generated/AcceptanceTicket.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.voytty.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/VoyttyNativeFFI.modulemap
    dependencies:
      - target: Voytty
  VoyttyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: Generated/UIAcceptance.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonfox28.voytty.uitests
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Create and remove a disposable photo for native picker acceptance.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Voytty
schemes:
  Voytty:
    build:
      targets:
        Voytty: all
    test:
      targets: [VoyttyTests]
  VoyttyUI:
    build:
      targets:
        Voytty: all
    test:
      targets: [VoyttyUITests]
