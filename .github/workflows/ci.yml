name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer PR head supersedes the older run; every main commit keeps its own
# exact-SHA evidence and release candidate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Classify the exact PR changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Default to full checks unless only allowlisted documentation changed
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/workflow-policy.py classify

  policy:
    name: Policy and portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component rustfmt
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: policy
      - name: Run the canonical portable policy profile
        run: just ci-policy
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce with just ci-policy after just doctor." >> "$GITHUB_STEP_SUMMARY"

  rust:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    name: Rust / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      # Without debuginfo the trimmed dependency cache fits its size bound.
      CARGO_PROFILE_DEV_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            docs: false
          - label: Linux x64
            os: ubuntu-24.04
            docs: true
          - label: Linux arm64
            os: ubuntu-24.04-arm
            docs: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        shell: bash
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy --component rust-src
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled dependencies
        id: compiled
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: ci-compiled-v3-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-compiled-v3-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore noq test dependencies
        id: compiled-noq
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/noq-tests/debug/deps
            target/noq-tests/debug/build
            target/noq-tests/debug/.fingerprint
          key: ci-compiled-noq-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/noq-proto/Cargo.lock', 'vendor/noq-proto/Cargo.toml') }}
          restore-keys: |
            ci-compiled-noq-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore iroh test dependencies
        id: compiled-iroh
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/iroh-tests/debug/deps
            target/iroh-tests/debug/build
            target/iroh-tests/debug/.fingerprint
          key: ci-compiled-iroh-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/iroh/Cargo.lock', 'vendor/iroh/Cargo.toml') }}
          restore-keys: |
            ci-compiled-iroh-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: rust
      - name: Run full Unix platform evidence
        shell: bash
        run: just ci-unix "${{ matrix.docs }}"
      - name: Bound the main compiled dependency cache
        id: trim
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiled.outputs.cache-hit != 'true'
        run: sh tools/ci/trim-rust-cache.sh
      - name: Save main compiled dependencies
        if: steps.trim.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Bound the main noq test dependency cache
        id: trim-noq
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiled-noq.outputs.cache-hit != 'true'
        env:
          VOYTTY_CACHE_MANIFEST_PATH: vendor/noq-proto/Cargo.toml
          VOYTTY_CACHE_TARGET_DIR: target/noq-tests
        run: sh tools/ci/trim-rust-cache.sh
      - name: Save main noq test dependencies
        if: steps.trim-noq.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/noq-tests/debug/deps
            target/noq-tests/debug/build
            target/noq-tests/debug/.fingerprint
          key: ${{ steps.compiled-noq.outputs.cache-primary-key }}
      - name: Bound the main iroh test dependency cache
        id: trim-iroh
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiled-iroh.outputs.cache-hit != 'true'
        env:
          VOYTTY_CACHE_MANIFEST_PATH: vendor/iroh/Cargo.toml
          VOYTTY_CACHE_TARGET_DIR: target/iroh-tests
        run: sh tools/ci/trim-rust-cache.sh
      - name: Save main iroh test dependencies
        if: steps.trim-iroh.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/iroh-tests/debug/deps
            target/iroh-tests/debug/build
            target/iroh-tests/debug/.fingerprint
          key: ${{ steps.compiled-iroh.outputs.cache-primary-key }}
      - name: Explain reproduction on failure
        if: failure()
        run: echo 'Reproduce on the matching Unix host with just ci-unix ${{ matrix.docs }}.' >> "$GITHUB_STEP_SUMMARY"

  # Every event builds and floor-checks the shipped binaries. Only main uploads
  # them: these builds embed a source commit, so they pass the official
  # distribution check, and unreviewed PR binaries must not leave the runner.
  candidates-macos:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    name: Release candidate / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore native dependencies only for PR checks
        id: compiled-native
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          lookup-only: ${{ github.event_name != 'pull_request' }}
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ci-compiled-native-v1-rust-1.98.0-macos13-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'tools/release/build-native.sh', 'tools/release/setup-glibc-builder.sh') }}
          restore-keys: |
            ci-compiled-native-v1-rust-1.98.0-macos13-${{ matrix.target }}-
      - name: Build and inspect the shipped binary boundary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export VOYTTY_SOURCE_COMMIT="$GITHUB_SHA"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          sh tools/release/build-native.sh release-input
      - name: Run the candidate CLI without arguments
        run: release-input/voytty-${{ matrix.target }}
      - name: Upload the main native candidate and identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-input/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Bound the cold main native dependency cache
        id: trim-native
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiled-native.outputs.cache-hit != 'true'
        run: sh tools/ci/trim-rust-cache.sh release
      - name: Save cold main native dependencies for PR checks
        if: steps.trim-native.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ${{ steps.compiled-native.outputs.cache-primary-key }}
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce on the exact native host with RELEASE_TARGET=${{ matrix.target }} sh tools/release/build-native.sh release-input with explicit VOYTTY_SOURCE_COMMIT and SOURCE_DATE_EPOCH." >> "$GITHUB_STEP_SUMMARY"

  candidates-linux:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    name: Release candidate / ${{ matrix.target }} / glibc 2.28
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Bootstrap Git for the pinned container checkout
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^# deb http://snapshot|deb [check-valid-until=no] http://snapshot|' \
            -e 's|^deb http://deb|# deb http://deb|' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tests/source-policy.sh
      - name: Prepare the pinned glibc builder
        run: sh tools/release/setup-glibc-builder.sh
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore native dependencies only for PR checks
        id: compiled-native
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          lookup-only: ${{ github.event_name != 'pull_request' }}
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ci-compiled-native-v1-rust-1.98.0-debian10-glibc228-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'tools/release/build-native.sh', 'tools/release/setup-glibc-builder.sh') }}
          restore-keys: |
            ci-compiled-native-v1-rust-1.98.0-debian10-glibc228-${{ matrix.target }}-
      - name: Build and inspect the shipped binary boundary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export VOYTTY_SOURCE_COMMIT="$GITHUB_SHA"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          sh tools/release/build-native.sh release-input
      - name: Run the candidate CLI without arguments
        run: release-input/voytty-${{ matrix.target }}
      - name: Upload the main native candidate and identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-input/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Bound the cold main native dependency cache
        id: trim-native
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiled-native.outputs.cache-hit != 'true'
        run: sh tools/ci/trim-rust-cache.sh release
      - name: Save cold main native dependencies for PR checks
        if: steps.trim-native.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ${{ steps.compiled-native.outputs.cache-primary-key }}
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce in the pinned Debian container with RELEASE_TARGET=${{ matrix.target }} sh tools/release/build-native.sh release-input with explicit VOYTTY_SOURCE_COMMIT and SOURCE_DATE_EPOCH." >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: dependencies
      - name: Run both dependency-policy owners
        run: just ci-dependencies
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce with just ci-dependencies." >> "$GITHUB_STEP_SUMMARY"

  relay:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    name: Official relay bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: rust
      - name: Register cross-architecture emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Create a BuildKit builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Run the complete relay evidence profile
        run: just ci-relay
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce on Docker-capable Linux with just ci-relay." >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    name: Android arm64 APK and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The host build only feeds uniffi-bindgen; its Kotlin output is identical
      # without debuginfo. The shipped library uses the release profile.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: sh tests/source-policy.sh
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore pinned cargo-ndk
        id: cargo-ndk
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/bin/cargo-ndk*
          key: ci-tools-v2-${{ runner.os }}-${{ runner.arch }}-android-rust-1.98.0-cargo-ndk-4.1.2
      - name: Restore Gradle dependency downloads
        id: gradle
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/**/*.lockfile', 'apps/android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-modules-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled Android dependencies for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/aarch64-linux-android/release/deps
            target/aarch64-linux-android/release/build
            target/aarch64-linux-android/release/.fingerprint
          key: ci-compiled-android-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-compiled-android-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Gradle compilation outputs only for PR checks
        id: gradle-build
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          lookup-only: ${{ github.event_name != 'pull_request' }}
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-v1-${{ runner.os }}-${{ runner.arch }}-java17-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'apps/android/gradle/**', 'apps/android/**/*.gradle.kts', 'apps/android/gradle.properties', 'apps/android/app/src/**', 'apps/android/app/gradle.lockfile', 'crates/**', 'proto/**', 'vendor/**', 'tools/android/**', 'tools/uniffi-bindgen/**') }}
          restore-keys: |
            gradle-build-v1-${{ runner.os }}-${{ runner.arch }}-java17-
      - name: Select pinned build tools
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-linux-android
          command -v cargo-ndk >/dev/null 2>&1 \
            || cargo +1.98.0 install cargo-ndk --version 4.1.2 --locked
          test "$(cargo +1.98.0 ndk --version)" = 'cargo-ndk 4.1.2'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build and check the Android candidate
        env:
          VOYTTY_ANDROID_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            export VOYTTY_SOURCE_COMMIT="$GITHUB_SHA"
          fi
          sh tools/android/build.sh --build-cache :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease :app:testDebugUnitTest
      - name: Inspect the unsigned release APK
        run: >-
          python3 tools/android/release.py prepare
          apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          --output android-candidate --commit "$GITHUB_SHA" --sdk "$ANDROID_HOME"
      - name: Retain the exact main APK candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-candidate
          path: android-candidate/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Verify all native libraries for 16 KB pages
        run: python3 tools/android/check-apk.py apps/android/app/build/outputs/apk/debug/app-debug.apk --sdk "$ANDROID_HOME"
      - name: Save cross-built debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-debug-build-only
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
          retention-days: 7
      - name: Evidence boundary
        run: echo 'Build, lint, JVM policy tests and packaging checks only. Native runtime, lifecycle and touch acceptance are recorded separately in docs/verification/session-continuity.md; emulator results do not replace phone, physical-network or signed-upgrade acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save main pinned cargo-ndk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-ndk.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cargo/bin/cargo-ndk*
          key: ${{ steps.cargo-ndk.outputs.cache-primary-key }}
      - name: Stop Gradle before saving its caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.gradle.outputs.cache-hit != 'true' || steps.gradle-build.outputs.cache-hit != 'true')
        run: apps/android/gradlew -p apps/android --stop
      - name: Save main Gradle dependency downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ steps.gradle.outputs.cache-primary-key }}
      - name: Bound the cold main Gradle compilation cache
        id: trim-gradle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-build.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "$HOME/.gradle/caches/build-cache-1" ]; then
            echo '::warning::Gradle produced no build cache; not saved'
            exit 0
          fi
          size=$(du -sk "$HOME/.gradle/caches/build-cache-1" | awk '{print $1}')
          if [ "$size" -le 1048576 ]; then
            echo 'cacheable=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Gradle build cache is $size KiB, above 1 GiB; not saved"
          fi
      - name: Save cold main Gradle compilation outputs for PR checks
        if: steps.trim-gradle.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-build.outputs.cache-primary-key }}
      # Main builds its APK candidate without compiled caches, then saves the
      # trimmed third-party outputs for later pull requests.
      - name: Look up main compiled Android dependencies
        id: compiled
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          lookup-only: true
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/aarch64-linux-android/release/deps
            target/aarch64-linux-android/release/build
            target/aarch64-linux-android/release/.fingerprint
          key: ci-compiled-android-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Bound the main compiled Android dependency cache
        id: trim
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiled.outputs.cache-hit != 'true'
        run: sh tools/ci/trim-rust-cache.sh debug release aarch64-linux-android/release
      - name: Save main compiled Android dependencies
        if: steps.trim.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/aarch64-linux-android/release/deps
            target/aarch64-linux-android/release/build
            target/aarch64-linux-android/release/.fingerprint
          key: ${{ steps.compiled.outputs.cache-primary-key }}

  candidate:
    name: Assemble the exact release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - candidates-macos
      - candidates-linux
      - android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Download the three native candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-input
          merge-multiple: true

      - name: Download the Android candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-candidate
          path: release-input

      - name: Build the single archive and manifest owner
        run: cargo +1.98.0 build --locked --release --package voytty-release-tool

      - name: Archive the three raw native candidates once
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            chmod 700 "release-input/voytty-$target"
            target/release/voytty-release-tool archive \
              "release-input/voytty-$target" \
              "release-input/voytty-$target.tar.gz"
          done

      - name: Assemble and verify the exact unsigned inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          version=$(cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "voytty-cli") | .version')
          released_at=$(date -u -d "@$(git show -s --format=%ct HEAD)" '+%Y-%m-%dT%H:%M:%SZ')
          target/release/voytty-release-tool \
            prepare release-input release-output "v$version" "$SOURCE_COMMIT" "$released_at"
          target/release/voytty-release-tool verify-unsigned release-output

      - name: Check the generated installer with ShellCheck
        run: |
          command -v shellcheck
          shellcheck -s sh release-output/voytty-install.sh

      - name: Upload the unsigned exact inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    name: iOS device build and simulator tests
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain and Apple targets
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --target aarch64-apple-ios --target aarch64-apple-ios-sim
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: rust
      - name: Install Xcode project generator
        run: brew install xcodegen
      - name: Cross-build unsigned device app
        run: just ios-device-build
      - name: Run simulator checks with ad-hoc signing and Keychain access
        run: just ios-check auto
      - name: Explain evidence boundary
        if: always()
        run: echo 'iOS checks reproduce with just ios-device-build and just ios-check auto. Device signing, phone input, network switching and disposable-host acceptance remain separate.' >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - policy
      - android
      - ios
      - rust
      - candidates-macos
      - candidates-linux
      - candidate
      - dependencies
      - relay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every event-owned evidence result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/workflow-policy.py gate
