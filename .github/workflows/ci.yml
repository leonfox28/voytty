name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact source expected by the full-check caller (optional for UI dispatch)
        type: string
        required: false

permissions:
  contents: read

# PRs check affected code; ordinary main pushes are quick. Explicit full runs
# retain exact-SHA candidates and are never cancelled by a later PR or push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Classify the exact PR changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      rust: ${{ steps.scope.outputs.rust }}
      transport: ${{ steps.scope.outputs.transport }}
      mobile: ${{ steps.scope.outputs.mobile }}
      relay: ${{ steps.scope.outputs.relay }}
      native: ${{ steps.scope.outputs.native }}
      candidate: ${{ steps.scope.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select affected checks, defaulting to full on unknown inputs
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 tools/ci/workflow-policy.py classify

  policy:
    name: Policy and portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component rustfmt
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: policy
      - name: Run the canonical portable policy profile
        run: just ci-policy
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce with just ci-policy after just doctor." >> "$GITHUB_STEP_SUMMARY"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      # Without debuginfo the trimmed dependency cache fits its size bound.
      CARGO_PROFILE_DEV_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            docs: false
          - label: Linux x64
            os: ubuntu-24.04
            docs: true
          - label: Linux arm64
            os: ubuntu-24.04-arm
            docs: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        shell: bash
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy --component rust-src
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled dependencies
        id: compiled
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: ci-compiled-v3-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-compiled-v3-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore noq test dependencies
        if: needs.changes.outputs.transport == 'true'
        id: compiled-noq
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/noq-tests/debug/deps
            target/noq-tests/debug/build
            target/noq-tests/debug/.fingerprint
          key: ci-compiled-noq-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/noq-proto/Cargo.lock', 'vendor/noq-proto/Cargo.toml') }}
          restore-keys: |
            ci-compiled-noq-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore iroh test dependencies
        if: needs.changes.outputs.transport == 'true'
        id: compiled-iroh
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/iroh-tests/debug/deps
            target/iroh-tests/debug/build
            target/iroh-tests/debug/.fingerprint
          key: ci-compiled-iroh-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/iroh/Cargo.lock', 'vendor/iroh/Cargo.toml') }}
          restore-keys: |
            ci-compiled-iroh-v1-rust-1.98.0-nodebug-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: rust
      - name: Run selected Unix checks
        shell: bash
        run: just ci-unix "${{ matrix.docs }}" "${{ needs.changes.outputs.transport }}"
      - name: Bound the main compiled dependency cache
        id: trim
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.compiled.outputs.cache-hit != 'true'
        run: sh tools/ci/trim-rust-cache.sh
      - name: Save main compiled dependencies
        if: steps.trim.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Bound the main noq test dependency cache
        id: trim-noq
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.compiled-noq.outputs.cache-hit != 'true'
        env:
          VOYTTY_CACHE_MANIFEST_PATH: vendor/noq-proto/Cargo.toml
          VOYTTY_CACHE_TARGET_DIR: target/noq-tests
        run: sh tools/ci/trim-rust-cache.sh
      - name: Save main noq test dependencies
        if: steps.trim-noq.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/noq-tests/debug/deps
            target/noq-tests/debug/build
            target/noq-tests/debug/.fingerprint
          key: ${{ steps.compiled-noq.outputs.cache-primary-key }}
      - name: Bound the main iroh test dependency cache
        id: trim-iroh
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.compiled-iroh.outputs.cache-hit != 'true'
        env:
          VOYTTY_CACHE_MANIFEST_PATH: vendor/iroh/Cargo.toml
          VOYTTY_CACHE_TARGET_DIR: target/iroh-tests
        run: sh tools/ci/trim-rust-cache.sh
      - name: Save main iroh test dependencies
        if: steps.trim-iroh.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/iroh-tests/debug/deps
            target/iroh-tests/debug/build
            target/iroh-tests/debug/.fingerprint
          key: ${{ steps.compiled-iroh.outputs.cache-primary-key }}
      - name: Explain reproduction on failure
        if: failure()
        run: echo 'Reproduce on the matching Unix host with just ci-unix ${{ matrix.docs }} ${{ needs.changes.outputs.transport }}.' >> "$GITHUB_STEP_SUMMARY"

  # Build/floor-check candidates only for affected build inputs or full checks.
  # Only explicit full checks on reviewed main may upload source-identified bytes.
  candidates-macos:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: Release candidate / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: sh tests/source-policy.sh
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore native dependencies only for PR checks
        id: compiled-native
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          lookup-only: ${{ github.event_name != 'pull_request' }}
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ci-compiled-native-v1-rust-1.98.0-macos13-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'tools/release/build-native.sh', 'tools/release/setup-glibc-builder.sh') }}
          restore-keys: |
            ci-compiled-native-v1-rust-1.98.0-macos13-${{ matrix.target }}-
      - name: Build and inspect the shipped binary boundary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export VOYTTY_SOURCE_COMMIT="$GITHUB_SHA"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          sh tools/release/build-native.sh release-input
      - name: Run the candidate CLI without arguments
        run: release-input/voytty-${{ matrix.target }}
      - name: Upload the main native candidate and identity
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-input/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Bound the cold main native dependency cache
        id: trim-native
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.compiled-native.outputs.cache-hit != 'true'
        run: sh tools/ci/trim-rust-cache.sh release
      - name: Save cold main native dependencies for PR checks
        if: steps.trim-native.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ${{ steps.compiled-native.outputs.cache-primary-key }}
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce on the exact native host with RELEASE_TARGET=${{ matrix.target }} sh tools/release/build-native.sh release-input with explicit VOYTTY_SOURCE_COMMIT and SOURCE_DATE_EPOCH." >> "$GITHUB_STEP_SUMMARY"

  candidates-linux:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: Release candidate / ${{ matrix.target }} / glibc 2.28
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Bootstrap Git for the pinned container checkout
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^# deb http://snapshot|deb [check-valid-until=no] http://snapshot|' \
            -e 's|^deb http://deb|# deb http://deb|' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source checkout policy
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tests/source-policy.sh
      - name: Prepare the pinned glibc builder
        run: sh tools/release/setup-glibc-builder.sh
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore native dependencies only for PR checks
        id: compiled-native
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          lookup-only: ${{ github.event_name != 'pull_request' }}
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ci-compiled-native-v1-rust-1.98.0-debian10-glibc228-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'tools/release/build-native.sh', 'tools/release/setup-glibc-builder.sh') }}
          restore-keys: |
            ci-compiled-native-v1-rust-1.98.0-debian10-glibc228-${{ matrix.target }}-
      - name: Build and inspect the shipped binary boundary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export VOYTTY_SOURCE_COMMIT="$GITHUB_SHA"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          sh tools/release/build-native.sh release-input
      - name: Run the candidate CLI without arguments
        run: release-input/voytty-${{ matrix.target }}
      - name: Upload the main native candidate and identity
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: release-input/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Bound the cold main native dependency cache
        id: trim-native
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.compiled-native.outputs.cache-hit != 'true'
        run: sh tools/ci/trim-rust-cache.sh release
      - name: Save cold main native dependencies for PR checks
        if: steps.trim-native.outputs.cacheable == 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ${{ steps.compiled-native.outputs.cache-primary-key }}
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce in the pinned Debian container with RELEASE_TARGET=${{ matrix.target }} sh tools/release/build-native.sh release-input with explicit VOYTTY_SOURCE_COMMIT and SOURCE_DATE_EPOCH." >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: dependencies
      - name: Run both dependency-policy owners
        run: just ci-dependencies
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce with just ci-dependencies." >> "$GITHUB_STEP_SUMMARY"

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    name: Official relay bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy
      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: rust
      - name: Register cross-architecture emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Create a BuildKit builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Run the complete relay evidence profile
        run: just ci-relay
      - name: Explain reproduction on failure
        if: failure()
        run: echo "Reproduce on Docker-capable Linux with just ci-relay." >> "$GITHUB_STEP_SUMMARY"

  mobile-core:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    name: Shared client / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: android
            targets: aarch64-linux-android
          - runner: macos-latest
            platform: ios
            targets: aarch64-apple-ios,aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and cross targets
        run: rustup toolchain install 1.98.0 --profile minimal --target '${{ matrix.targets }}'
      - uses: ./.github/actions/setup-ci-tools
        with:
          profile: rust
      - name: Install Android compiler
        if: matrix.platform == 'android'
        run: |
          cargo +1.98.0 install cargo-ndk --version 4.1.2 --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Check shared mobile dependencies
        run: just mobile-core-check '${{ matrix.platform }}'

  candidate:
    name: Assemble the exact release candidate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      - changes
      - candidates-macos
      - candidates-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore dependency downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Download the three native candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-input
          merge-multiple: true

      - name: Build the single archive and manifest owner
        run: cargo +1.98.0 build --locked --release --package voytty-release-tool

      - name: Archive the three raw native candidates once
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            chmod 700 "release-input/voytty-$target"
            target/release/voytty-release-tool archive \
              "release-input/voytty-$target" \
              "release-input/voytty-$target.tar.gz"
          done

      - name: Assemble and verify the exact unsigned inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          version=$(cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "voytty-cli") | .version')
          released_at=$(date -u -d "@$(git show -s --format=%ct HEAD)" '+%Y-%m-%dT%H:%M:%SZ')
          target/release/voytty-release-tool \
            prepare release-input release-output "v$version" "$SOURCE_COMMIT" "$released_at"
          target/release/voytty-release-tool verify-unsigned release-output

      - name: Check the generated installer with ShellCheck
        run: |
          command -v shellcheck
          shellcheck -s sh release-output/voytty-install.sh

      - name: Upload the unsigned exact inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - policy
      - mobile-core
      - rust
      - candidates-macos
      - candidates-linux
      - candidate
      - dependencies
      - relay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every event-owned evidence result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/workflow-policy.py gate
